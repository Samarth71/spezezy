<style>
:root{--bg:#ece7e6;--ink:#1d1a1c;--card:#fff;--mute:#6b6468;--line:#d9d2d1;--dk:#1d1a1c;--dkt:#fff;--on:#1d1a1c;--lime:#d3eba2;--lav:#c0c5f7;--teal:#bde0db;--but:#f6ea9c;--blue:#3866e6;--red:#e5484d;--grn:#2e9d5c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151214;--ink:#f3eeee;--card:#262123;--mute:#a79fa3;--line:#3a3336;--dk:#f3eeee;--dkt:#1d1a1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151214;--ink:#f3eeee;--card:#262123;--mute:#a79fa3;--line:#3a3336;--dk:#f3eeee;--dkt:#1d1a1c;color-scheme:dark}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 'Fira Sans',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:600px;margin:0 auto;padding:14px 14px 100px}
h1,h2,h3{margin:0;font-weight:600;line-height:1.1}
.top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.av{width:48px;height:48px;border-radius:50%;background:var(--but);display:grid;place-items:center;font-size:26px}
.chip{background:var(--card);border-radius:99px;padding:6px 12px;font-weight:600}
.sp{flex:1}.sm{font-size:14px;color:var(--mute)}
.c{border-radius:30px;padding:18px;margin-top:12px;color:var(--on);position:relative;overflow:hidden}
.lime{background:var(--lime)}.lav{background:var(--lav)}.teal{background:var(--teal)}.but{background:var(--but)}.wh{background:var(--card);color:var(--ink)}
.c h2{font-size:30px}.big{font-size:40px;font-weight:600}
.em{position:absolute;right:14px;bottom:6px;font-size:58px;line-height:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2>.c{margin-top:12px;min-height:150px}
.pill{border:0;border-radius:99px;padding:11px 20px;background:var(--dk);color:var(--dkt);font:600 15px 'Fira Sans';cursor:pointer}
.pill.out{background:transparent;border:1.5px solid var(--on);color:var(--on)}
.pill.w{width:100%;padding:15px;font-size:17px;margin-top:10px}
.pill:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible,.w:focus-visible,.seg button:focus-visible,.nav button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sq{width:64px;height:64px;border-radius:20px;border:0;background:var(--blue);color:#fff;font-size:28px;cursor:pointer}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px solid rgba(29,26,28,.15)}
.box{width:28px;height:28px;border-radius:50%;border:2px solid var(--on);display:grid;place-items:center;font-weight:700;flex:none}.box.on{background:var(--on);color:var(--but)}
.bar{height:34px;border-radius:99px;background:rgba(29,26,28,.12);overflow:hidden;margin-top:14px}
.bar i{display:flex;align-items:center;padding:0 14px;height:100%;background:repeating-linear-gradient(135deg,#a9dc78 0 8px,#9bd267 8px 16px);font-weight:600;white-space:nowrap;min-width:56px}
.bar.s{height:10px;margin:0}.bar.s i{padding:0;min-width:0}
.seg{display:flex;gap:6px;background:var(--bg);border-radius:99px;padding:5px}
.seg button{flex:1;border:0;border-radius:99px;padding:10px;background:none;color:var(--ink);font:600 15px 'Fira Sans';cursor:pointer}.seg button.on{background:var(--dk);color:var(--dkt)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{border:0;border-radius:24px;padding:14px 10px;min-height:120px;text-align:left;color:#1d1a1c;font:600 15px 'Fira Sans';cursor:pointer}
.tile b{display:block;font-size:36px;margin-bottom:6px}.tile small{display:block;font-weight:400}
.pen{background:var(--red);color:#fff;border-radius:30px;padding:18px;margin-top:12px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:0;color:var(--ink);border-radius:22px;padding:16px;margin-top:10px;font:500 17px 'Fira Sans';cursor:pointer}
.opt.ok{background:var(--grn);color:#fff}.opt.no{background:var(--red);color:#fff}

.tt{width:64px;height:34px;border-radius:99px;border:0;background:#f6d98a;position:relative;cursor:pointer;flex:none;margin-right:6px;transition:background .5s ease,transform .15s}.tt:active{transform:scale(.93)}.tt:focus-visible{outline:3px solid var(--pu);outline-offset:2px}.tt::before{content:"";position:absolute;left:12px;top:9px;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:9px 9px 0 #fff,16px 1px 0 #fff;opacity:0;transition:opacity .5s}.tt .kn{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fffdf7;color:#e39a00;display:grid;place-items:center;transition:transform .55s cubic-bezier(.3,1.4,.5,1),background .5s,color .5s;box-shadow:0 2px 6px rgba(0,0,0,.2)}.tt .kn svg{grid-area:1/1;width:16px;height:16px;transition:transform .55s cubic-bezier(.3,1.4,.5,1),opacity .35s}.kn .mo{opacity:0;transform:rotate(-90deg) scale(.4)}[data-theme="dark"] .tt{background:#3b3566}[data-theme="dark"] .tt::before{opacity:1}[data-theme="dark"] .tt .kn{transform:translateX(30px);background:#1e1b33;color:#f8d66d}[data-theme="dark"] .kn .su{opacity:0;transform:rotate(90deg) scale(.4)}[data-theme="dark"] .kn .mo{opacity:1;transform:none}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}html.tx *,html.tx *::before,html.tx *::after{transition:background-color .5s ease,color .5s ease,border-color .5s ease!important}
.wod.pwa{background:linear-gradient(120deg,#ebe6ff,#d6d0ff)}
@keyframes sheetUp{from{transform:translateY(100%)}}@keyframes fadeIn{from{opacity:0}}
html{overscroll-behavior-y:none}button,a,input,select,textarea{touch-action:manipulation}h1,h2,.sc{text-wrap:balance}.go,.pillb,.op,.cp{position:relative;overflow:hidden}.rp{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;transform:scale(0);animation:rp .6s ease-out forwards}@keyframes rp{from{transform:scale(0);opacity:.28}to{transform:scale(1);opacity:0}}
.bn{background:color-mix(in srgb,var(--sh) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
@media(prefers-reduced-motion:no-preference){#app.in{animation:tabIn .4s cubic-bezier(.2,.8,.2,1) both}@keyframes tabIn{from{opacity:0;transform:translateY(10px)}}.mc:first-child svg{transform-origin:50% 90%;animation:flick 1.6s ease-in-out infinite}@keyframes flick{0%,100%{transform:scale(1)}30%{transform:scale(1.15,.92)}60%{transform:scale(.94,1.12)}}.mc:nth-child(2) svg{animation:beat 1.5s ease-in-out infinite}@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}.mc:nth-child(3) svg{animation:twk 3s ease-in-out infinite}@keyframes twk{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(25deg) scale(1.2)}}.tile0 img{animation:bob 4s ease-in-out infinite}.sq{animation:pulse 1.8s infinite}.fbk{animation:bnc .45s both}.stc{transition:transform .2s}.stc:active{transform:scale(.98)}}
.bigav{width:68px;height:68px;border-radius:50%;background:var(--yl);display:grid;place-items:center;font-size:36px;box-shadow:0 6px 16px rgba(0,0,0,.12);flex:none}.avg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 12px}.avg button{aspect-ratio:1;border:2px solid var(--ln);background:var(--sh);border-radius:16px;font-size:24px;cursor:pointer;transition:transform .2s,border-color .2s,background .2s}.avg button.on{border-color:var(--pu);background:var(--yl);transform:scale(1.08)}.acr{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--c2);color:var(--ink);border-radius:18px;padding:12px 14px;margin-top:8px;cursor:pointer;font:600 16px 'Plus Jakarta Sans',sans-serif;text-align:left;transition:transform .2s}.acr:active{transform:scale(.98)}.acr span{font-size:26px;width:30px;text-align:center}.acr small{margin-left:auto;color:var(--mute)}.clk{display:flex;align-items:center;gap:14px;background:var(--c2);border-radius:22px;padding:14px 16px;margin-bottom:16px}.clk b{font-size:30px;display:block;font-variant-numeric:tabular-nums;line-height:1.15}.clk span,.clk small{display:block;color:var(--mute);font-size:13px}.clk svg{flex:none;color:var(--ink)}
